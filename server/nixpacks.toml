[phases.setup]
nixPkgs = [
  "nodejs_20",
  "chromium",
  "nss",
  "freetype",
  "harfbuzz",
  "cacert",
  "dejavu_fonts",
  "glib",
  "expat",
  "libdrm",
  "mesa"
]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npx puppeteer browsers install chrome || true"]

[start]
cmd = "node index.js"